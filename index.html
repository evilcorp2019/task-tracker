<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Task Time Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
:root {
  --navy:        #0f172a;
  --navy-mid:    #1e293b;
  --blue:        #2563eb;
  --blue-lt:     #dbeafe;
  --amber:       #b45309;
  --amber-lt:    #fef3c7;
  --green:       #15803d;
  --green-lt:    #dcfce7;
  --purple:      #6d28d9;
  --purple-lt:   #ede9fe;
  --slate:       #64748b;
  --border:      #e2e8f0;
  --bg:          #f1f5f9;
  --white:       #ffffff;
  --text:        #0f172a;
  --red:         #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 13px; }
body {
  font-family: 'IBM Plex Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ---- HEADER ---- */
.hdr {
  background: var(--navy);
  color: #fff;
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 300;
  box-shadow: 0 2px 6px rgba(0,0,0,.35);
}
.hdr-left { display: flex; align-items: center; gap: 14px; }
.app-title { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
.month-badge {
  background: rgba(255,255,255,.15);
  border-radius: 4px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
}
.hdr-right { display: flex; align-items: center; gap: 8px; }
.hdr select {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
  padding: 5px 8px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
  font-family: 'IBM Plex Sans', sans-serif;
}
.hdr select option { background: var(--navy-mid); }
.btn {
  padding: 6px 14px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all .15s;
  font-family: 'IBM Plex Sans', sans-serif;
  white-space: nowrap;
}
.btn-ghost  { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #fff; }
.btn-ghost:hover  { background: rgba(255,255,255,.2); }
.btn-blue   { background: var(--blue); color: #fff; }
.btn-blue:hover   { background: #1d4ed8; }
.btn-green  { background: #166534; color: #fff; }
.btn-green:hover  { background: #14532d; }

/* ---- DATE BAR ---- */
.date-bar {
  background: var(--navy-mid);
  color: rgba(255,255,255,.75);
  padding: 7px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  font-size: 11.5px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.date-bar b { color: #93c5fd; }

/* ---- ADMIN PANEL ---- */
.admin-wrap {
  background: #fff;
  border-bottom: 2px solid var(--border);
  padding: 14px 20px 18px;
}
.admin-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.admin-top h2 { font-size: 13px; font-weight: 700; color: var(--navy); }
.admin-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px 16px;
}
.sec-label {
  grid-column: 1 / -1;
  font-size: 10px;
  font-weight: 700;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: .8px;
  padding: 6px 0 4px;
  border-bottom: 1px solid var(--border);
  margin-top: 4px;
}
.fg { display: flex; flex-direction: column; gap: 3px; }
.fg label { font-size: 10.5px; font-weight: 600; color: var(--slate); text-transform: uppercase; letter-spacing: .4px; }
.fg input, .fg select {
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  font-family: 'IBM Plex Sans', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.fg input:focus, .fg select:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37,99,235,.1); }

/* ---- TASK CONTAINER ---- */
.task-wrap { padding: 14px 20px; }
.day-group { margin-bottom: 18px; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.day-hdr {
  padding: 9px 14px;
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .7px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
}
.day-hdr.pre  { background: #92400e; }
.day-hdr.thu  { background: #1e40af; }
.day-hdr.fri  { background: #065f46; }
.day-hdr.post { background: #4c1d95; }
.day-date { font-weight: 400; opacity: .8; font-size: 10.5px; }
.task-cnt { margin-left: auto; background: rgba(255,255,255,.2); padding: 2px 8px; border-radius: 10px; font-size: 11px; }

/* ---- TASK TABLE ---- */
.tbl-wrap { overflow-x: auto; background: #fff; }
table.ttbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 11.5px;
  min-width: 1200px;
}
table.ttbl th {
  background: #f8fafc;
  padding: 7px 8px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: .5px;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
table.ttbl td {
  padding: 6px 8px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
}
table.ttbl tr:hover td { background: #f8fafc; }
table.ttbl tr:last-child td { border-bottom: none; }
.t-num   { color: var(--slate); font-weight: 600; font-size: 10.5px; width: 28px; min-width: 28px; }
.t-name  { font-weight: 500; min-width: 220px; max-width: 280px; line-height: 1.4; }
.t-name-hdr {
  font-weight: 700;
  color: var(--navy);
  background: #f0fdf4;
  padding: 6px 8px;
  border-left: 3px solid var(--green);
  min-width: 220px;
}
.badge-assigned {
  display: inline-block;
  background: var(--blue-lt);
  color: #1e40af;
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 10.5px;
  font-weight: 700;
  white-space: nowrap;
}
.fc {
  font-size: 11px;
  color: var(--slate);
  white-space: nowrap;
  font-family: 'IBM Plex Mono', monospace;
  min-width: 130px;
}
.fc.na { color: #cbd5e1; font-style: italic; }
.prop-cell, .book-cell {
  font-size: 11px;
  color: #475569;
  max-width: 150px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---- INPUTS ---- */
input.ti {
  width: 82px;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  font-family: 'IBM Plex Mono', monospace;
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
input.ti:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37,99,235,.1); }
.time-wrap { display: flex; align-items: center; gap: 3px; }
.now-btn {
  padding: 3px 6px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--blue);
  border-radius: 3px;
  background: var(--blue-lt);
  color: var(--blue);
  font-family: 'IBM Plex Sans', sans-serif;
  white-space: nowrap;
  transition: all .15s;
  line-height: 1.4;
}
.now-btn:hover { background: var(--blue); color: #fff; }

select.ss {
  padding: 4px 5px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  font-family: 'IBM Plex Sans', sans-serif;
  outline: none;
  cursor: pointer;
  width: 62px;
}
select.ss.s100 { background: #dcfce7; color: #15803d; border-color: #86efac; }
select.ss.s50  { background: #fef3c7; color: #b45309; border-color: #fcd34d; }
select.ss.s0   { background: #fee2e2; color: var(--red); border-color: #fca5a5; }

select.tzs {
  padding: 4px 5px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  font-family: 'IBM Plex Sans', sans-serif;
  outline: none;
  width: 82px;
  background: #f8fafc;
  cursor: pointer;
}
input.ci {
  width: 150px;
  padding: 4px 7px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  font-family: 'IBM Plex Sans', sans-serif;
  outline: none;
  transition: border-color .15s;
}
input.ci:focus { border-color: var(--blue); }
.dur-cell {
  font-size: 11px;
  color: var(--green);
  font-weight: 700;
  font-family: 'IBM Plex Mono', monospace;
  min-width: 50px;
  white-space: nowrap;
}

/* ---- SAVE TOAST ---- */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #1e293b;
  color: #fff;
  padding: 10px 18px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
  opacity: 0;
  transition: opacity .3s;
  z-index: 999;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ---- TABS ---- */
.tab-bar {
  background: var(--navy-mid);
  display: flex;
  gap: 2px;
  padding: 0 20px;
  border-bottom: 2px solid rgba(255,255,255,.08);
}
.tab-btn {
  padding: 10px 18px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  background: transparent;
  color: rgba(255,255,255,.5);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  font-family: 'IBM Plex Sans', sans-serif;
  transition: color .15s, border-color .15s;
  letter-spacing: .3px;
}
.tab-btn:hover  { color: rgba(255,255,255,.8); }
.tab-btn.active { color: #fff; border-bottom-color: #3b82f6; }

/* ---- STATUS TAB ---- */
.stat-wrap { padding: 16px 20px; }
.stat-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.stat-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
}
.stat-card .sc-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 6px;
}
.stat-card .sc-value {
  font-size: 26px;
  font-weight: 700;
  color: var(--navy);
  line-height: 1;
}
.stat-card .sc-sub {
  font-size: 12px;
  color: var(--slate);
  margin-top: 3px;
}
.stat-card.c-green .sc-value { color: var(--green); }
.stat-card.c-amber .sc-value { color: var(--amber); }
.stat-card.c-red   .sc-value { color: var(--red); }

.stat-section-title {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: .7px;
  margin-bottom: 10px;
}
.group-prog-wrap {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 18px;
  margin-bottom: 18px;
}
.prog-row { margin-bottom: 14px; }
.prog-row:last-child { margin-bottom: 0; }
.prog-meta {
  display: flex;
  justify-content: space-between;
  margin-bottom: 5px;
  font-size: 12px;
}
.prog-label { font-weight: 600; color: var(--navy); }
.prog-info  { color: var(--slate); }
.prog-info b { color: var(--navy); }
.prog-track {
  background: #f1f5f9;
  border-radius: 4px;
  height: 8px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  border-radius: 4px;
  transition: width .4s ease;
}

.detail-filters {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.detail-filters select {
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  font-family: 'IBM Plex Sans', sans-serif;
  outline: none;
  background: #fff;
  cursor: pointer;
  color: var(--text);
}
.detail-tbl-wrap {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
table.dtbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  table-layout: fixed;
}
table.dtbl th {
  background: #f8fafc;
  padding: 8px 10px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  color: var(--slate);
  text-transform: uppercase;
  letter-spacing: .5px;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
table.dtbl td {
  padding: 7px 10px;
  border-bottom: 1px solid #f1f5f9;
  vertical-align: middle;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
table.dtbl tr:last-child td { border-bottom: none; }
table.dtbl tr:nth-child(even) td { background: #f8fafc; }
.st-pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.st-100 { background: #dcfce7; color: #15803d; }
.st-50  { background: #fef3c7; color: #b45309; }
.st-0   { background: #fee2e2; color: #dc2626; }

/* ---- AUTH MODAL ---- */
.auth-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.auth-box {
  background: #fff; border-radius: 10px; padding: 28px 32px;
  width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,.25);
}
.auth-box h3 { font-size: 16px; font-weight: 700; color: var(--navy); margin: 0 0 6px; }
.auth-box p  { font-size: 12.5px; color: var(--slate); margin: 0 0 16px; line-height: 1.5; }
.auth-box input[type=password] {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 5px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif;
  outline: none; margin-bottom: 8px; box-sizing: border-box;
}
.auth-box input[type=password]:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37,99,235,.1); }
.auth-error { font-size: 12px; color: var(--red); min-height: 16px; margin-bottom: 12px; font-weight: 500; }
.auth-btns  { display: flex; gap: 8px; justify-content: flex-end; }
.auth-btns button {
  padding: 7px 16px; border-radius: 5px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; border: none;
}
.auth-cancel { background: #f1f5f9; color: var(--slate); }
.auth-cancel:hover { background: #e2e8f0; }
.auth-submit { background: var(--blue); color: #fff; }
.auth-submit:hover { background: #1d4ed8; }

/* ---- LOGIN SCREEN ---- */
.login-screen {
  position: fixed; inset: 0; background: var(--navy);
  display: flex; align-items: center; justify-content: center;
  z-index: 10000; flex-direction: column; gap: 0;
}
.login-card {
  background: #fff; border-radius: 12px; padding: 36px 40px;
  width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.login-logo {
  text-align: center; margin-bottom: 24px;
}
.login-logo .app-name {
  font-size: 18px; font-weight: 700; color: var(--navy); display: block; margin-top: 8px;
}
.login-logo .app-sub {
  font-size: 12px; color: var(--slate); margin-top: 4px; display: block;
}
.login-card label {
  display: block; font-size: 11px; font-weight: 700; color: var(--slate);
  text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px;
}
.login-card input[type=password] {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px; font-family: 'IBM Plex Sans', sans-serif;
  outline: none; box-sizing: border-box; margin-bottom: 8px;
  transition: border-color .15s;
}
.login-card input[type=password]:focus {
  border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12);
}
.login-error {
  font-size: 12px; color: var(--red); font-weight: 500;
  min-height: 18px; margin-bottom: 10px;
}
.login-btn {
  width: 100%; padding: 10px; background: var(--blue); color: #fff;
  border: none; border-radius: 6px; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
  transition: background .15s; letter-spacing: .2px;
}
.login-btn:hover { background: #1d4ed8; }
.login-note {
  text-align: center; font-size: 11px; color: rgba(255,255,255,.35);
  margin-top: 20px;
}


  </style>
</head>
<body>

<!-- ========= LOGIN SCREEN ========= -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="10" fill="#0f172a"/>
        <rect x="10" y="18" width="20" height="14" rx="3" fill="#3b82f6"/>
        <path d="M14 18v-4a6 6 0 0 1 12 0v4" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="20" cy="25" r="2" fill="#fff"/>
      </svg>
      <span class="app-name">Monthly Task Time Tracker</span>
      <span class="app-sub">Enter your password to continue</span>
    </div>
    <label>Password</label>
    <input type="password" id="authInput" placeholder="Enter password"
           onkeydown="if(event.key==='Enter')submitAuth()">
    <div class="login-error" id="authError"></div>
    <button class="login-btn" onclick="submitAuth()">Sign In</button>
  </div>
  <div class="login-note">Session ends when this tab is closed</div>
</div>

<!-- ========= APP (hidden until login) ========= -->
<div id="appContent" style="display:none">

<!-- ========= HEADER ========= -->
<div class="hdr">
  <div class="hdr-left">
    <div class="app-title">Monthly Task Time Tracker</div>
    <div class="month-badge" id="monthBadge">May 2026</div>
  </div>
  <div class="hdr-right">
    <select id="monthSel" onchange="onMonthChange()"></select>
    <button class="btn btn-ghost" onclick="toggleAdmin()" id="adminBtn">Admin Panel</button>
    <button class="btn btn-blue" onclick="generateExcel()">Generate Excel</button>
    <button class="btn btn-green" onclick="exportActuals()">Export with Actuals</button>
  </div>
</div>

<!-- ========= DATE BAR ========= -->
<div class="date-bar" id="dateBar"></div>

<!-- ========= TAB BAR ========= -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabBtnTasks"  onclick="switchTab('tasks')">Task List</button>
  <button class="tab-btn"        id="tabBtnStatus" onclick="switchTab('status')">Status</button>
</div>

<!-- ========= ADMIN PANEL ========= -->
<div class="admin-wrap" id="adminPanel" style="display:none"></div>

<!-- ========= TASK LIST ========= -->
<div id="taskWrap" class="task-wrap"></div>

<!-- ========= STATUS TAB ========= -->
<div id="statusWrap" class="stat-wrap" style="display:none"></div>



</div><!-- end #appContent -->

<!-- ========= TOAST ========= -->
<div class="toast" id="toast">Saved</div>

<script>
// ============================================================
// ACCESS CONTROL
// Change PASSWORD below to update the app password.
// Status tab and task VIEW are public (no password needed).
// Password is required to edit times, status, or Admin Panel.
// ============================================================
const PASSWORD = 'tracker2026';
let SESSION_UNLOCKED = false;

// ============================================================
// SECTION 1: TEAM MEMBERS
// Change the values (right side) to update display names.
// Keys on the left (A, R, L, M) must NOT be changed.
// ============================================================
const MEMBERS = {
  A: 'Mr.A',
  R: 'Mr.R',
  L: 'Mr.L',
  M: 'Mr.M'
};

// ============================================================
// SECTION 2: MONTHLY PARAMETERS
// Admin updates these each month in the Admin Panel.
// These are default values (May 2026 baseline).
// ============================================================
let PARAMS = {
  list1:             '.2026q2^.2026q2a^.2026q2d^.2026q2r',
  list2:             '.2026q2^.2026q2a^.2026q2d^.2026q2r',
  lastYearBook:      'May 2025',
  snapshotBook1:     'May 2026',
  snapshotBook2:     '',
  rollingBook:       'Rolling Forecast',
  snapshotParam:     "0^''^0d45e964.groups.Company.com@amer.teams.ms^",
  businessPlanParam: "1^''^0d45e964.groups.Company.com@amer.teams.ms^",
  selectedYear:      2026,
  selectedMonth:     5,
  dateOverrides:     {}
};

// ============================================================
// SECTION 3: TASK LIST
// Hardcoded from May 2026 Excel blueprint.
// Modify only if the annual task list changes.
//
// dayGroup: 'pre' = Pre-Week, 'thu' = Thursday,
//           'fri' = Friday,  'post' = Post-Week
//
// Token placeholders resolved at runtime:
//   {LIST1_LIST2}   -> list1 + list2

// SECTION 4: APP STATE
// Runtime state - tracks actual time entries per task
// ============================================================
let STATE = {
  year: PARAMS.selectedYear,
  month: PARAMS.selectedMonth,
  adminOpen: false,
  actuals: {}
};

// Key helper: year_month_taskid ensures each month has its own actuals
function akey(id) { return STATE.year + '_' + STATE.month + '_' + id; }

// Initialize default actuals for a task (called when key not found)
function initActual(t) {
  // Prior to June 2026: default status 100 (completed)
  // June 2026 onwards:  default status 0  (not started)
  const isPast = STATE.year < 2026 || (STATE.year === 2026 && STATE.month < 6);
  const defaultStatus = isPast ? 100 : 0;
  return { start:'', end:'', duration:'', status:defaultStatus, tz:t.tz, comment:'' };
}

// ============================================================
// SECTION 5: PERSISTENCE (localStorage)
// ============================================================
function persist() {
  try {
    localStorage.setItem('ttt_actuals', JSON.stringify(STATE.actuals));
    localStorage.setItem('ttt_params',  JSON.stringify(PARAMS));
    localStorage.setItem('ttt_members', JSON.stringify(MEMBERS));
    localStorage.setItem('ttt_ym',      JSON.stringify({ y: STATE.year, m: STATE.month }));
  } catch(e) {}
  showToast('Saved');
}

function isFutureMonth(y, m) {
  // June 2026 onwards is "future" (status should default to 0)
  return y > 2026 || (y === 2026 && m >= 6);
}

function loadSaved() {
  try {
    const a = localStorage.getItem('ttt_actuals');
    const p = localStorage.getItem('ttt_params');
    const mb = localStorage.getItem('ttt_members');
    const ym = localStorage.getItem('ttt_ym');
    if (a)  Object.assign(STATE.actuals, JSON.parse(a));
    if (p)  Object.assign(PARAMS, JSON.parse(p));
    if (mb) { const mv = JSON.parse(mb); Object.keys(mv).forEach(k => { if (MEMBERS[k] !== undefined) MEMBERS[k] = mv[k]; }); }
    if (ym) { const v = JSON.parse(ym); STATE.year = v.y; STATE.month = v.m; PARAMS.selectedYear = v.y; PARAMS.selectedMonth = v.m; }
  } catch(e) {}
  // Migration: fix any stale status=100 saved for future months
  // Runs every load to correct any carried-over defaults
  migrateActualStatus();
}

function migrateActualStatus() {
  // For every saved actual key (format: year_month_taskId),
  // if the month is June 2026 or later, force status to 0
  // UNLESS the user has explicitly entered a start time (meaning they worked on it)
  let changed = false;
  Object.keys(STATE.actuals).forEach(key => {
    const parts = key.split('_');
    if (parts.length < 3) return;
    const y = parseInt(parts[0]), m = parseInt(parts[1]);
    if (isFutureMonth(y, m)) {
      const actual = STATE.actuals[key];
      // Only reset if no actual time has been entered (preserves real user data)
      if (actual.status === 100 && !actual.start && !actual.end) {
        actual.status = 0;
        changed = true;
      }
    }
  });
  if (changed) {
    try { localStorage.setItem('ttt_actuals', JSON.stringify(STATE.actuals)); } catch(e) {}
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// SECTION 6: DATE UTILITIES
// ============================================================
const MNAMES = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function weekDates(y, m) {
  // Returns first Thursday and Friday of month m (1-indexed)
  let thu = null, fri = null;
  for (let d = 1; d <= 7; d++) {
    const dt = new Date(y, m - 1, d);
    if (!thu && dt.getDay() === 4) thu = dt;
    if (!fri && dt.getDay() === 5) fri = dt;
  }
  return { thu, fri };
}

// Returns effective Thursday/Friday: uses admin override if set, else auto-calculates
function getEffectiveDates() {
  const key = STATE.year + '_' + STATE.month;
  const ov  = PARAMS.dateOverrides && PARAMS.dateOverrides[key];
  if (ov) {
    const fri = new Date(ov + 'T00:00:00');
    const thu = new Date(fri);
    thu.setDate(fri.getDate() - 1);
    return { thu, fri, overridden: true };
  }
  const auto = weekDates(STATE.year, STATE.month);
  return { thu: auto.thu, fri: auto.fri, overridden: false };
}

function fmtDate(d) {
  return d ? d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' }) : 'N/A';
}

function calcDur(s, e) {
  if (!s || !e) return '';
  const [sh, sm] = s.split(':').map(Number);
  const [eh, em] = e.split(':').map(Number);
  let diff = (eh * 60 + em) - (sh * 60 + sm);
  if (diff < 0) diff += 1440;
  const h = Math.floor(diff / 60), mn = diff % 60;
  if (h === 0) return mn + 'm';
  return mn === 0 ? h + 'h' : h + 'h ' + mn + 'm';
}

// ============================================================
// PROPERTY LIST AUTO-GENERATORS
// Type A: Jan=prevYrQ4, Feb-Apr=Q1, May-Jul=Q2, Aug-Oct=Q3, Nov-Dec=Q4
// Type B: Jan-Mar=Q1,   Apr-Jun=Q2, Jul-Sep=Q3, Oct-Dec=Q4 (always current yr)
// Type C: Jan=prevYrQ4, Feb-Mar=Q1, Apr-Jun=Q2, Jul-Sep=Q3, Oct-Dec=Q4
// Format: .{y}q{n}^.{y}q{n}a^.{y}q{n}d^.{y}q{n}r
// ============================================================
function makePropList(qy, qn) {
  const p = '.' + qy + 'q' + qn;
  return p + '^' + p + 'a^' + p + 'd^' + p + 'r';
}
function propListA(y, m) {
  if (m === 1)                return makePropList(y - 1, 4);
  if (m >= 2  && m <= 4)      return makePropList(y, 1);
  if (m >= 5  && m <= 7)      return makePropList(y, 2);
  if (m >= 8  && m <= 10)     return makePropList(y, 3);
                              return makePropList(y, 4);
}
function propListB(y, m) {
  if (m >= 1  && m <= 3)      return makePropList(y, 1);
  if (m >= 4  && m <= 6)      return makePropList(y, 2);
  if (m >= 7  && m <= 9)      return makePropList(y, 3);
                              return makePropList(y, 4);
}
function propListC(y, m) {
  if (m === 1)                return makePropList(y - 1, 4);
  if (m >= 2  && m <= 3)      return makePropList(y, 1);
  if (m >= 4  && m <= 6)      return makePropList(y, 2);
  if (m >= 7  && m <= 9)      return makePropList(y, 3);
                              return makePropList(y, 4);
}

function resolve(text) {
  if (!text) return '';
  const y = PARAMS.selectedYear, m = PARAMS.selectedMonth;
  const currMM = String(m).padStart(2, '0');
  const prevM  = m === 1 ? 12 : m - 1;
  const prevMM = String(prevM).padStart(2, '0');
  return text
    .replace(/\{PROP_A\}/g, propListA(y, m))
    .replace(/\{PROP_B\}/g, propListB(y, m))
    .replace(/\{PROP_C\}/g, propListC(y, m))
    .replace(/\{LAST_YEAR_BOOK\}/g, PARAMS.lastYearBook)
    .replace(/\{SNAPSHOT_BOOK1\}/g, PARAMS.snapshotBook1)
    .replace(/\{SNAPSHOT_BOOK2\}/g, PARAMS.snapshotBook2)
    .replace(/\{BUSINESS_PLAN_PARAM\}/g, PARAMS.businessPlanParam)
    .replace(/\{ROLLING_BOOK\}/g, PARAMS.rollingBook)
    .replace(/\{SNAPSHOT_PARAM\}/g, PARAMS.snapshotParam)
    .replace(/\{YEAR_10\}/g, y + 10)
    .replace(/\{CURR_MM\}/g, currMM)
    .replace(/\{PREV_MM\}/g, prevMM)
    .replace(/\{YEAR\}/g, y)
    .replace(/\{MONTH\}/g, MNAMES[m - 1]);
}

function displayName(asgn) {
  if (asgn === 'Mr.L/Mr.A') return MEMBERS.L + '/' + MEMBERS.A;
  if (asgn === '-') return '-';
  const key = asgn.replace('Mr.', '');
  return MEMBERS[key] || asgn;
}

// ============================================================
// AUTO PROPERTY LIST LOGIC
// Jan       -> (year-1) Q4
// Feb,Mar,Apr -> year Q1
// May,Jun,Jul -> year Q2
// Aug,Sep,Oct -> year Q3
// Nov,Dec     -> year Q4
// Format: .{y}q{n}^.{y}q{n}a^.{y}q{n}d^.{y}q{n}r
// ============================================================
function autoPropertyList(y, m) {
  let qy = y, qn;
  if      (m === 1)                 { qy = y - 1; qn = 4; }
  else if (m >= 2  && m <= 4)       { qn = 1; }
  else if (m >= 5  && m <= 7)       { qn = 2; }
  else if (m >= 8  && m <= 10)      { qn = 3; }
  else                              { qn = 4; }
  const p = '.' + qy + 'q' + qn;
  return p + '^' + p + 'a^' + p + 'd^' + p + 'r';
}

function applyDateOverride() {

  if (!PARAMS.dateOverrides) PARAMS.dateOverrides = {};
  if (val) {

function bulkSetStatus(group, val, confId) {
  const tasks = group === 'all' ? TASKS : TASKS.filter(t => t.dg === group);
  tasks.forEach(t => {
    if (t.isHeader) return;
    const k = akey(t.id);
    if (!STATE.actuals[k]) STATE.actuals[k] = initActual(t);
    STATE.actuals[k].status = Number(val);

  persist();
  renderTasks();
  const conf = document.getElementById('bc_' + confId);
  if (conf) {
    conf.classList.add('show');
    setTimeout(() => conf.classList.remove('show'), 2000);
  }
}

  const nm   = displayName(t.asgn);

    <td class="t-name" title="${t.task}">${t.task}</td>
    <td><span class="badge-assigned">${nm}</span></td>

    <td class="book-cell" title="${book}">${book || '-'}</td>

    <td>
      <select class="ss ${sc}" onchange="upd(${t.id},'status',this.value);this.className='ss '+(this.value==100?'s100':this.value==50?'s50':'s0')">
        <option value="0"   ${a.status==0  ?'selected':''}>0%</option>
        <option value="50"  ${a.status==50 ?'selected':''}>50%</option>
        <option value="100" ${a.status==100?'selected':''}>100%</option>
      </select>
    </td>
    <td>
      <select class="tzs" onchange="upd(${t.id},'tz',this.value)">
        <option ${a.tz==='Mountain'?'selected':''}>Mountain</option>
        <option ${a.tz==='India'   ?'selected':''}>India</option>
        <option ${a.tz==='Eastern' ?'selected':''}>Eastern</option>
      </select>

    <td><div class="time-wrap"><input type="time" class="ti" id="ti_e_${t.id}" value="${a.end}" onchange="upd(${t.id},'end',this.value)"><button class="now-btn" onclick="setNow(${t.id},'end')">Now</button></div></td>
    <td class="dur-cell" id="dur${t.id}">${a.duration}</td>
    <td><input type="text" class="ci" placeholder="Add comment..." value="${a.comment}" oninput="upd(${t.id},'comment',this.value)"></td>
  </tr>`;
}

function upd(id, field, val) {
  const k = akey(id);
  if (!STATE.actuals[k]) { const t = TASKS.find(x=>x.id===id); STATE.actuals[k] = initActual(t||{}); }
  STATE.actuals[k][field] = val;
  if (field === 'start' || field === 'end') {
    const a = STATE.actuals[k];
    const d = calcDur(a.start, a.end);
    STATE.actuals[k].duration = d;
    const el = document.getElementById('dur' + id);
    if (el) el.textContent = d;
  }
  persist();
}

function styleCell(cell, bgArgb, fontOpts, borderOn, alignOpts) {
  if (bgArgb) cell.fill = {type:'pattern', pattern:'solid', fgColor:{argb:bgArgb}};
  cell.font   = Object.assign({name:'Arial', size:10}, fontOpts || {});
  if (borderOn !== false) cell.border = THIN;
  cell.alignment = Object.assign({vertical:'middle'}, alignOpts || {});
}

// Convert HH:MM string (from <input type=time>) to Excel time fraction
// Excel time = fraction of 24h day: 0.5 = 12:00 noon
function timeStrToExcel(s) {
  if (!s) return null;
  const parts = s.split(':');
  if (parts.length < 2) return null;
  const h = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return null;
  return (h * 60 + m) / 1440;
}

    let dateSuffix = '';
    if (dg === 'thu' && tD) dateSuffix = '  (' + tD.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ')';
    if (dg === 'fri' && fD) dateSuffix = '  (' + fD.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) + ')';

    // Group label row (merged, colored)
    const gRow = wsT.addRow({day: gc.label + dateSuffix});
    wsT.mergeCells(gRow.number, 1, gRow.number, XL_COLS.length);
    styleCell(gRow.getCell(1), gc.bg, {bold:true, color:{argb:gc.fg}, size:10}, true, {horizontal:'left', indent:1});
    gRow.height = 18;

    let alt = 0;
    tasks.forEach(t => {
      if (t.isHeader) {
        // Sub-header row
        const sh = wsT.addRow({day: '  ' + t.task});
        wsT.mergeCells(sh.number, 1, sh.number, XL_COLS.length);
        styleCell(sh.getCell(1), 'FFF0FDF4', {bold:true, color:{argb:'FF15803D'}}, true, {horizontal:'left', indent:2});
        sh.height = 16;
        return;
      }

      const k = akey(t.id);
      const a = STATE.actuals[k] || initActual(t);
      const rowBg = alt % 2 === 0 ? 'FFFFFFFF' : 'FFF1F5F9';
      alt++;

      const startVal = withActuals ? timeStrToExcel(a.start) : null;
      const endVal   = withActuals ? timeStrToExcel(a.end)   : null;

      const row = wsT.addRow({
        day:     dayLabel[t.dg],
        task:    t.task,
        asgn:    displayName(t.asgn),
        prop:    resolve(t.prop) || '',
        book:    resolve(t.book) || '',
        status:  withActuals ? (a.status !== undefined ? a.status + '%' : '') : '',
        tz:      withActuals ? (a.tz || '') : '',
        start:   startVal !== null ? startVal : '',
        end:     endVal   !== null ? endVal   : '',
        dur:     '',   // always formula-driven, set below
        comment: withActuals ? (a.comment || '') : '',
      });
      row.height = 16;

      // Apply time format to Actual Start (col 8) and Actual End (col 9)
      const rn = row.number;
      const startCell = row.getCell(8);
      const endCell   = row.getCell(9);
      const durCell   = row.getCell(10);

      if (startVal !== null) startCell.numFmt = 'h:MM AM/PM';
      if (endVal   !== null) endCell.numFmt   = 'h:MM AM/PM';

      // Timezone dropdown (col 7) - data validation with the 3 timezones
      const tzCell = row.getCell(7);
      tzCell.dataValidation = {
        type:        'list',
        allowBlank:  true,
        showDropDown: false,
        formulae:    ['"Mountain,India,Eastern"'],
        showErrorMessage: true,
        errorStyle:  'warning',
        errorTitle:  'Invalid Timezone',
        error:       'Please select Mountain, India, or Eastern'
      };

      // Duration formula: handles overnight (end < start) by adding 1 day
      // Displays as Xh MMm  e.g. "2h 05m"
      if (withActuals && (startVal !== null || endVal !== null)) {
        durCell.value = {
          formula: `IF(AND(H${rn}<>"",I${rn}<>""),IF(I${rn}>=H${rn},I${rn}-H${rn},1+I${rn}-H${rn}),"")`,
          result: ''
        };
        durCell.numFmt = '[h]"h "mm"m"';
      }

      row.eachCell({includeEmpty:true}, (c, ci) => {
        if (ci === 6 && withActuals) {
          // Status color
          const sv = Number(a.status);
          const sBg = sv === 100 ? 'FFDCFCE7' : sv === 50 ? 'FFFEF3C7' : 'FFFEE2E2';
          const sFg = sv === 100 ? 'FF15803D' : sv === 50 ? 'FFB45309' : 'FFDC2626';
          styleCell(c, sBg, {bold:true, color:{argb:sFg}}, true, {horizontal:'center'});
        } else if (ci === 8 || ci === 9) {
          // Start / End time cells
          styleCell(c, rowBg, {}, true, {horizontal:'center'});
        } else if (ci === 10) {
          // Duration cell
          styleCell(c, rowBg, {}, true, {horizontal:'center'});
        } else {
          styleCell(c, rowBg, {}, true, {
            wrapText: ci === 2,
            horizontal: ci === 3 ? 'center' : 'left'
          });
        }
      });
    });
  });

  return wb;
}

async function generateExcel() {
  const wb = await buildWorkbook(false);
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'TaskList_' + MNAMES[STATE.month-1] + '_' + STATE.year + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function exportActuals() {
  const wb = await buildWorkbook(true);
  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});

  a.download = 'TaskList_' + MNAMES[STATE.month-1] + '_' + STATE.year + '_Actuals.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    document.getElementById('loginScreen').style.display  = 'none';
    document.getElementById('appContent').style.display   = 'block';

let activeTab = 'tasks';

  activeTab = tab;
  document.getElementById('taskWrap').style.display    = tab === 'tasks'  ? '' : 'none';
  document.getElementById('statusWrap').style.display  = tab === 'status' ? '' : 'none';

// ============================================================
// STATUS TAB: COMPUTE STATS
// ============================================================
function parseDurMin(durStr) {
  if (!durStr) return 0;
  const h = durStr.match(/(\d+)h/);
  const m = durStr.match(/(\d+)m/);
  return (h ? parseInt(h[1]) : 0) * 60 + (m ? parseInt(m[1]) : 0);
}

function fmtMin(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return h + 'h ' + String(m).padStart(2,'0') + 'm';
}

function computeStats() {
  const tasks = TASKS.filter(t => !t.isHeader && (!t.months || t.months.includes(STATE.month)));
  let done = 0, inProg = 0, pending = 0, totalMin = 0;
  tasks.forEach(t => {
    const a = STATE.actuals[akey(t.id)] || initActual(t);
    if      (Number(a.status) === 100) done++;
    else if (Number(a.status) === 50)  inProg++;
    else                               pending++;
    totalMin += parseDurMin(a.duration);
  });
  return { total: tasks.length, done, inProg, pending, totalMin };
}

function computeGroupStats(dg) {
  const tasks = TASKS.filter(t => t.dg === dg && !t.isHeader && (!t.months || t.months.includes(STATE.month)));
  let done = 0, inProg = 0;
  tasks.forEach(t => {
    const a = STATE.actuals[akey(t.id)] || initActual(t);
    if      (Number(a.status) === 100) done++;
    else if (Number(a.status) === 50)  inProg++;
  });
  return { total: tasks.length, done, inProg, pending: tasks.length - done - inProg };
}

// ============================================================
// STATUS TAB: RENDER
// ============================================================
function renderStatus() {
  const s   = computeStats();
  const pct = s.total ? Math.round(s.done / s.total * 100) : 0;

  const grpDefs = [
    { key:'pre',  label:'Pre-Week Tasks',  color:'#92400e' },
    { key:'thu',  label:'Thursday Tasks',  color:'#1e40af' },
    { key:'fri',  label:'Friday Tasks',    color:'#065f46' },
    { key:'post', label:'Post-Week Tasks', color:'#4c1d95' },
  ];

  // KPI cards
  const cards = `
    <div class="stat-cards">
      <div class="stat-card">
        <div class="sc-label">Tasks completed</div>
        <div class="sc-value">${s.done} <span style="font-size:15px;color:var(--slate)">/ ${s.total}</span></div>
        <div class="sc-sub">${s.pending} pending &nbsp;|&nbsp; ${s.inProg} in progress</div>
      </div>
      <div class="stat-card c-green">
        <div class="sc-label">Overall completion</div>
        <div class="sc-value">${pct}%</div>
        <div class="sc-sub">${s.done} of ${s.total} tasks done</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Total time logged</div>
        <div class="sc-value">${fmtMin(s.totalMin)}</div>
        <div class="sc-sub">Across all tasks with actuals</div>
      </div>
      <div class="stat-card c-amber">
        <div class="sc-label">In progress (50%)</div>
        <div class="sc-value">${s.inProg}</div>
        <div class="sc-sub">${s.pending} not yet started</div>
      </div>
    </div>`;

  // Group progress bars
  const progRows = grpDefs.map(g => {
    const gs  = computeGroupStats(g.key);
    const pct = gs.total ? Math.round(gs.done / gs.total * 100) : 0;
    const partPct = gs.total ? Math.round((gs.done + gs.inProg * 0.5) / gs.total * 100) : 0;
    return `
      <div class="prog-row">
        <div class="prog-meta">
          <span class="prog-label">${g.label}</span>
          <span class="prog-info">${gs.done}/${gs.total} done &nbsp; <b>${pct}%</b></span>
        </div>
        <div class="prog-track">
          <div class="prog-fill" style="width:${pct}%;background:${g.color}"></div>
        </div>
      </div>`;
  }).join('');

  const progress = `
    <div class="stat-section-title">Progress by group</div>
    <div class="group-prog-wrap">${progRows}</div>`;

  // Task detail table (with filter state)
  const stFilter = document.getElementById('st-filter-status') ? document.getElementById('st-filter-status').value : 'all';
  const mbFilter = document.getElementById('st-filter-member') ? document.getElementById('st-filter-member').value : 'all';

  const memberOpts = Object.keys(MEMBERS).map(k =>
    `<option value="${k}" ${mbFilter===k?'selected':''}>${MEMBERS[k]}</option>`).join('');

  const filteredTasks = TASKS.filter(t => {
    if (t.isHeader) return false;
    const a = STATE.actuals[akey(t.id)] || initActual(t);
    const st = Number(a.status);
    if (stFilter === '100' && st !== 100) return false;
    if (stFilter === '50'  && st !== 50)  return false;
    if (stFilter === '0'   && st !== 0)   return false;
    if (mbFilter !== 'all') {
      const memberName = MEMBERS[mbFilter] || '';
      if (!t.asgn.includes(memberName) && !t.asgn.includes('Mr.' + mbFilter)) return false;
    }
    return true;
  });

  const dayLbl = { pre:'Pre-Week', thu:'Thursday', fri:'Friday', post:'Post-Week' };

  const detailRows = filteredTasks.map((t, i) => {
    const a   = STATE.actuals[akey(t.id)] || initActual(t);
    const st  = Number(a.status);
    const cls = st === 100 ? 'st-100' : st === 50 ? 'st-50' : 'st-0';
    return `
      <tr>
        <td style="width:32px;color:#94a3b8">${t.id}</td>
        <td style="max-width:300px" title="${t.task}">${t.task}</td>
        <td style="width:70px;text-align:center">${displayName(t.asgn)}</td>
        <td style="width:80px;text-align:center;color:#64748b">${dayLbl[t.dg]}</td>
        <td style="width:72px;text-align:center"><span class="st-pill ${cls}">${st}%</span></td>
        <td style="width:70px;text-align:center;font-family:'IBM Plex Mono',monospace;color:#64748b">${a.duration || '-'}</td>
      </tr>`;
  }).join('');

  const details = `
    <div class="stat-section-title" style="margin-top:4px">Task details</div>
    <div class="detail-filters">
      <select id="st-filter-status" onchange="renderStatus()">
        <option value="all"  ${stFilter==='all'?'selected':''}>All tasks</option>
        <option value="100"  ${stFilter==='100'?'selected':''}>Completed only</option>
        <option value="50"   ${stFilter==='50' ?'selected':''}>In progress only</option>
        <option value="0"    ${stFilter==='0'  ?'selected':''}>Pending only</option>
      </select>
      <select id="st-filter-member" onchange="renderStatus()">
        <option value="all" ${mbFilter==='all'?'selected':''}>All members</option>
        ${memberOpts}
      </select>
      <span style="font-size:11px;color:#64748b;align-self:center">${filteredTasks.length} task${filteredTasks.length!==1?'s':''} shown</span>
    </div>
    <div class="detail-tbl-wrap">
      <table class="dtbl">
        <thead><tr>
          <th>#</th><th>Task</th><th>Assigned</th><th>Group</th><th>Status</th><th>Duration</th>
        </tr></thead>
        <tbody>${detailRows || '<tr><td colspan="6" style="text-align:center;padding:16px;color:#94a3b8">No tasks match the selected filters</td></tr>'}</tbody>
      </table>
    </div>`;

  document.getElementById('statusWrap').innerHTML =
    `<div style="max-width:1400px">${cards}${progress}${details}</div>`;
}

function setNow(id, field) {
  const now = new Date();
  const hh  = String(now.getHours()).padStart(2, '0');
  const mm  = String(now.getMinutes()).padStart(2, '0');
  const t   = hh + ':' + mm;
  const elId = field === 'start' ? 'ti_s_' + id : 'ti_e_' + id;
  const el  = document.getElementById(elId);
  if (el) el.value = t;
  upd(id, field, t);
}
